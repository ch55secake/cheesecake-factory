name: Release

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name used for built binaries, artifacts, and release assets.
        required: false
        type: string
        default: app
      build-package:
        description: Go package containing the executable to build.
        required: false
        type: string
        default: .
      go-version-file:
        description: File used by setup-go to determine the Go version.
        required: false
        type: string
        default: go.mod
      targets:
        description: JSON array of GOOS and GOARCH targets.
        required: false
        type: string
        default: '[{"goos":"linux","goarch":"amd64"},{"goos":"darwin","goarch":"amd64"}]'
      release-tag:
        description: Release tag to use. Defaults to a date and commit-based tag.
        required: false
        type: string
        default: ''
      generate-notes:
        description: Generate release notes from the commits included in the release.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          mkdir -p dist
          go build -o "dist/${{ inputs.binary-name }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}" "${{ inputs.build-package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary-name }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/${{ inputs.binary-name }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date -u +'%Y-%m-%d')-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          GENERATE_NOTES: ${{ inputs.generate-notes }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/"$BINARY_NAME"-*/"$BINARY_NAME"-*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found for $BINARY_NAME" >&2
            exit 1
          fi

          release_options=(--title "$RELEASE_TAG" --target "$GITHUB_SHA")
          if [[ "$GENERATE_NOTES" == 'true' ]]; then
            release_options+=(--generate-notes)
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_options[@]}"
