name: go-release

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name used for the binary and release archives.
        required: false
        type: string
        default: app
      build-package:
        description: Go package containing the executable to build.
        required: false
        type: string
        default: .
      cgo-enabled:
        description: Value for CGO_ENABLED during release builds.
        required: false
        type: string
        default: '1'
      ldflags:
        description: Optional flags passed to the Go linker.
        required: false
        type: string
        default: ''
      go-version-file:
        description: File used by setup-go to determine the Go version.
        required: false
        type: string
        default: go.mod
      targets:
        description: JSON array of GOOS and GOARCH targets.
        required: false
        type: string
        default: '[{"goos":"linux","goarch":"amd64"},{"goos":"darwin","goarch":"amd64"}]'
      version:
        description: Optional semantic version override, without the v prefix.
        required: false
        type: string
        default: ''
      goreleaser-version:
        description: GoReleaser version installed by the release action.
        required: false
        type: string
        default: '~> v2'
      generate-notes:
        description: Generate release notes from the commits included in the release.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Resolve release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          latest_major=0
          latest_minor=0
          latest_patch=0
          found_release=false

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}

              if [[ "$found_release" == false ]] ||
                (( major > latest_major )) ||
                (( major == latest_major && minor > latest_minor )) ||
                (( major == latest_major && minor == latest_minor && patch > latest_patch )); then
                latest_major=$major
                latest_minor=$minor
                latest_patch=$patch
                found_release=true
              fi
            fi
          done < <(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')

          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Version must use major.minor.patch format, got: $VERSION" >&2
              exit 1
            fi

            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            if [[ "$found_release" == true ]] &&
              ! (( major > latest_major ||
                (major == latest_major && minor > latest_minor) ||
                (major == latest_major && minor == latest_minor && patch > latest_patch) )); then
              echo "Version $VERSION must be greater than the latest release v$latest_major.$latest_minor.$latest_patch" >&2
              exit 1
            fi
          elif [[ "$found_release" == true ]]; then
            major=$latest_major
            minor=$latest_minor
            patch=$((latest_patch + 1))
            VERSION="$major.$minor.$patch"
          else
            VERSION=1.0.0
          fi

          RELEASE_TAG="v$VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git -c tag.gpgSign=false -c tag.forceSignAnnotated=false tag "$RELEASE_TAG" "$GITHUB_SHA"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate GoReleaser configuration
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          BUILD_PACKAGE: ${{ inputs.build-package }}
          CGO_ENABLED: ${{ inputs.cgo-enabled }}
          GENERATE_NOTES: ${{ inputs.generate-notes }}
          LDFLAGS: ${{ inputs.ldflags }}
          REPOSITORY: ${{ github.repository }}
          TARGETS: ${{ inputs.targets }}
          CONFIG_PATH: ${{ runner.temp }}/goreleaser.generated.yaml
        run: |
          set -euo pipefail

          config="$CONFIG_PATH"
          yaml_quote() {
            jq -Rn --arg value "$1" '$value'
          }

          if ! jq -e 'type == "array" and length > 0' <<< "$TARGETS" >/dev/null; then
            echo 'targets must be a non-empty JSON array' >&2
            exit 1
          fi

          owner=${REPOSITORY%%/*}
          repository_name=${REPOSITORY#*/}
          printf 'version: 2\n' > "$config"
          printf 'project_name: %s\n' "$(yaml_quote "$BINARY_NAME")" >> "$config"
          printf 'builds:\n' >> "$config"

          declare -A seen_targets=()
          target_count=$(jq 'length' <<< "$TARGETS")
          for ((index = 0; index < target_count; index++)); do
            target=$(jq -c ".[$index]" <<< "$TARGETS")
            goos=$(jq -r '.goos // empty' <<< "$target")
            goarch=$(jq -r '.goarch // empty' <<< "$target")
            target_key="$goos/$goarch"

            if [[ ! "$goos" =~ ^[a-z0-9_]+$ ]] || [[ ! "$goarch" =~ ^[a-z0-9_]+$ ]]; then
              echo "Invalid target: $target" >&2
              exit 1
            fi
            if [[ -n "${seen_targets[$target_key]:-}" ]]; then
              echo "Duplicate target: $target_key" >&2
              exit 1
            fi
            seen_targets[$target_key]=1

            printf '  - id: %s\n' "build-$goos-$goarch" >> "$config"
            printf '    main: %s\n' "$(yaml_quote "$BUILD_PACKAGE")" >> "$config"
            printf '    binary: %s\n' "$(yaml_quote "$BINARY_NAME")" >> "$config"
            printf '    goos:\n      - %s\n' "$(yaml_quote "$goos")" >> "$config"
            printf '    goarch:\n      - %s\n' "$(yaml_quote "$goarch")" >> "$config"
            printf '    env:\n      - %s\n' "$(yaml_quote "CGO_ENABLED=$CGO_ENABLED")" >> "$config"
            if [[ -n "$LDFLAGS" ]]; then
              printf '    ldflags:\n      - %s\n' "$(yaml_quote "$LDFLAGS")" >> "$config"
            fi
          done

          cat >> "$config" <<EOF
          archives:
            - formats:
                - tar.gz
              name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
          checksum:
            name_template: checksums.txt
          release:
            github:
              owner: $(yaml_quote "$owner")
              name: $(yaml_quote "$repository_name")
            target_commitish: '{{ .Commit }}'
            name_template: 'v{{ .Version }}'
          EOF

          if [[ "$GENERATE_NOTES" != true ]]; then
            cat >> "$config" <<'EOF'
          changelog:
            disable: true
          EOF
          fi

          cat "$config"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: release --clean --config ${{ runner.temp }}/goreleaser.generated.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
