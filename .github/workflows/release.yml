name: go-release

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name used for built binaries, artifacts, and release assets.
        required: false
        type: string
        default: app
      build-package:
        description: Go package containing the executable to build.
        required: false
        type: string
        default: .
      ldflags:
        description: Optional flags passed to the Go linker.
        required: false
        type: string
        default: ''
      go-version-file:
        description: File used by setup-go to determine the Go version.
        required: false
        type: string
        default: go.mod
      targets:
        description: JSON array of GOOS and GOARCH targets.
        required: false
        type: string
        default: '[{"goos":"linux","goarch":"amd64"},{"goos":"darwin","goarch":"amd64"}]'
      version:
        description: Optional semantic version override, without the v prefix.
        required: false
        type: string
        default: ''
      generate-notes:
        description: Generate release notes from the commits included in the release.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          BUILD_PACKAGE: ${{ inputs.build-package }}
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          LDFLAGS: ${{ inputs.ldflags }}
        run: |
          mkdir -p dist
          build_args=(-o "dist/$BINARY_NAME-$GOOS-$GOARCH")
          if [[ -n "$LDFLAGS" ]]; then
            build_args+=(-ldflags "$LDFLAGS")
          fi
          go build "${build_args[@]}" "$BUILD_PACKAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary-name }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/${{ inputs.binary-name }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          latest_major=0
          latest_minor=0
          latest_patch=0
          found_release=false

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}

              if [[ "$found_release" == false ]] ||
                (( major > latest_major )) ||
                (( major == latest_major && minor > latest_minor )) ||
                (( major == latest_major && minor == latest_minor && patch > latest_patch )); then
                latest_major=$major
                latest_minor=$minor
                latest_patch=$patch
                found_release=true
              fi
            fi
          done < <(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')

          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Version must use major.minor.patch format, got: $VERSION" >&2
              exit 1
            fi

            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            if [[ "$found_release" == true ]] &&
              ! (( major > latest_major ||
                (major == latest_major && minor > latest_minor) ||
                (major == latest_major && minor == latest_minor && patch > latest_patch) )); then
              echo "Version $VERSION must be greater than the latest release v$latest_major.$latest_minor.$latest_patch" >&2
              exit 1
            fi
          elif [[ "$found_release" == true ]]; then
            major=$latest_major
            minor=$latest_minor
            patch=$((latest_patch + 1))
            VERSION="$major.$minor.$patch"
          else
            VERSION=1.0.0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          GENERATE_NOTES: ${{ inputs.generate-notes }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/"$BINARY_NAME"-*/"$BINARY_NAME"-*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found for $BINARY_NAME" >&2
            exit 1
          fi

          release_options=(--title "$RELEASE_TAG" --target "$GITHUB_SHA")
          if [[ "$GENERATE_NOTES" == 'true' ]]; then
            release_options+=(--generate-notes)
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_options[@]}" --repo "$REPOSITORY"
