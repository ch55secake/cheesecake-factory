name: Go Lint

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: Version of golangci-lint to install.
        required: false
        type: string
        default: v2.13.1
      args:
        description: Additional arguments passed to golangci-lint.
        required: false
        type: string
        default: --timeout=5m

permissions:
  contents: read

concurrency:
  group: go-lint-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: ${{ inputs.args }}
