name: Pull Request Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        description: Path to the caller repository's labeler configuration.
        required: false
        type: string
        default: .github/labeler.yml
      sync-labels:
        description: Remove labels that no longer match the configuration.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ inputs.configuration-path }}
          sync-labels: ${{ inputs.sync-labels }}
